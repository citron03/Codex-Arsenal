name: CI

# Pushes to `main` are covered by the Release workflow, which runs the same
# checks before publishing. This workflow only guards pull requests.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci
      - run: npm run check:invariants
      - run: npm test
      - run: npm pack --dry-run

  release-preview:
    # Principle 8 makes the commit message decide the released version, with no
    # human checkpoint after it. This job is that checkpoint: it reports what
    # merging would publish, while the pull request can still be changed.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci

      - name: Report the version this pull request would release
        run: |
          node scripts/release-preview.mjs > preview.json
          cat preview.json

          bump="$(node -p "require('./preview.json').bump ?? ''")"
          version="$(node -p "require('./preview.json').nextVersion ?? ''")"
          last="$(node -p "require('./preview.json').lastRelease ?? 'none'")"
          count="$(node -p "require('./preview.json').commitsAnalysed")"

          {
            echo "## Release preview"
            echo
            if [ -n "$version" ]; then
              echo "Merging this pull request publishes **v${version}** to npm — a \`${bump}\` release over ${last}."
            else
              echo "No releasable commits. Merging this pull request publishes nothing."
              echo
              echo "That is correct for a docs-only or chore-only change. If this pull request fixes a bug or adds a feature, its commit types do not say so yet."
            fi
            echo
            echo "Analysed ${count} commit(s) since ${last} with @semantic-release/commit-analyzer — the same module, preset and configuration the Release workflow uses."
          } >> "$GITHUB_STEP_SUMMARY"
