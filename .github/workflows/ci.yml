name: CI

# Pushes to `main` are covered by the Release workflow, which runs the same
# checks before publishing. This workflow only guards pull requests.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
